server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite content-hashes them)
    location ~* \.(js|css|woff2?|png|svg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
