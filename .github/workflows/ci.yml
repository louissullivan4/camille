name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend: Lint & format ────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.9.0"

      - name: ruff check
        run: python -m ruff check app/

      - name: ruff format check
        run: python -m ruff format --check app/

  # ── 2. Backend: Unit tests (SQLite in-memory, no Docker) ────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for WeasyPrint
        run: sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev pkg-config

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            -x \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml

  # ── 3. Backend: Build Docker image ──────────────────────────────────────────
  backend-build:
    name: Backend Build Image
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build backend image
        run: docker build -t camille-backend:${{ github.sha }} backend/

      - name: Export image to tar
        run: docker save camille-backend:${{ github.sha }} -o /tmp/camille-backend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: camille-backend-image
          path: /tmp/camille-backend.tar
          retention-days: 1

  # ── 4. Backend: Integration tests (real Postgres + built image) ─────────────
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-build]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: camille
          POSTGRES_USER: camille
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camille -d camille"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: camille-backend-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/camille-backend.tar

      - name: Start MinIO
        run: |
          docker run -d \
            --name camille-minio \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO and create bucket
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is healthy"
              break
            fi
            sleep 2
          done
          docker run --rm --network host \
            -e MC_HOST_ci=http://minioadmin:minioadmin@localhost:9000 \
            minio/mc:latest mb --ignore-existing ci/camille-documents-ci

      - name: Start API container
        run: |
          docker run -d \
            --name camille-api \
            --network host \
            -e DATABASE_URL="postgresql+asyncpg://camille:localdev@localhost:5432/camille" \
            -e ANTHROPIC_API_KEY="dummy" \
            -e AWS_ACCESS_KEY_ID="minioadmin" \
            -e AWS_SECRET_ACCESS_KEY="minioadmin" \
            -e S3_BUCKET_NAME="camille-documents-ci" \
            -e S3_ENDPOINT_URL="http://localhost:9000" \
            -e ENVIRONMENT="test" \
            -e SENTRY_DSN="" \
            camille-backend:${{ github.sha }}

      - name: Run Alembic migrations
        run: |
          docker exec camille-api \
            sh -c "cd /app && alembic upgrade head"

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... attempt $i/30"
            sleep 2
          done
          echo "API failed to become healthy" >&2
          docker logs camille-api
          exit 1

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for WeasyPrint
        run: sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev pkg-config

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: backend
        run: pytest tests/integration/ -v --tb=short
        env:
          API_BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql+asyncpg://camille:localdev@localhost:5432/camille

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== API logs ===" && docker logs camille-api || true
          echo "=== MinIO logs ===" && docker logs camille-minio || true

  # ── 5. Frontend: Lint & type check ──────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── 6. Frontend: Unit tests ──────────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage/
        if: always()

  # ── 7. Frontend: Build & Docker image ────────────────────────────────────────
  frontend-build:
    name: Frontend Build Image
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build frontend image
        run: docker build -t camille-frontend:${{ github.sha }} frontend/

      - name: Export image to tar
        run: docker save camille-frontend:${{ github.sha }} -o /tmp/camille-frontend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: camille-frontend-image
          path: /tmp/camille-frontend.tar
          retention-days: 1
